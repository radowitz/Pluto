# Refresh the Pluto TV US playlist and XMLTV guide.
# Stream JWTs expire after about 24 hours, so this runs every 4 hours.
# A run that finds no file changes exits successfully without committing.

name: Update Pluto TV playlist

on:
  schedule:
    - cron: "17 */4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-pluto-playlist
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Generate playlist and EPG
        run: python3 scripts/generate_pluto_m3u.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- playlists/plutotv_us.m3u epg/plutotv_us.xml epg/plutotv_us.xml.gz
          if git diff --cached --quiet; then
            echo "No playlist changes to commit."
            exit 0
          fi
          git commit -m "Update Pluto TV US playlist and EPG"
          git push
