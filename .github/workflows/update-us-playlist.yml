# Refresh the combined US playlist and XMLTV guide.
# Pluto session URLs expire after about 24 hours, so this runs every 4 hours.
# One job writes the combined files and the Pluto intermediate files together.
# A run that finds no file changes exits successfully without committing.
# A failed generate leaves the previous files untouched.

name: Update US live playlist

on:
  schedule:
    - cron: "17 */4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-us-playlist
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Generate combined playlist and EPG
        run: python3 scripts/generate_us_playlist.py

      - name: Refuse blocked URLs
        run: |
          if grep -Ei 'jmp2\.uk|workers\.dev|trycloudflare\.com|cloudflareworkers\.com|x-access-token' \
            playlists/us.m3u epg/us.xml playlists/plutotv_us.m3u epg/plutotv_us.xml; then
            echo "Blocked marker found in generated output."
            exit 1
          fi

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- playlists/us.m3u epg/us.xml epg/us.xml.gz playlists/plutotv_us.m3u epg/plutotv_us.xml epg/plutotv_us.xml.gz
          if git diff --cached --quiet; then
            echo "No playlist changes to commit."
            exit 0
          fi
          git commit -m "Update combined US live playlist and EPG"
          git push
